# Browser E2E of the maintenance panel (Playwright, headless Chromium) against a production build with job-local dummy credentials.
# Fictional data only; no secrets, no deploy. Read-only permissions.
name: e2e
on:
  pull_request:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  maintenance-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the fictional test world (reused by the E2E seed)
        run: npx tsc -p tsconfig.maintenance.json
      - run: npm run build
      - name: Install Playwright (not an app dependency)
        run: |
          npm install --no-save @playwright/test@1.49.1
          npx playwright install --with-deps chromium
      - name: Job-local dummy password
        run: |
          PW=$(openssl rand -hex 16)
          echo "::add-mask::$PW"
          echo "E2E_PW=$PW" >> "$GITHUB_ENV"
      - name: E2E
        run: npx playwright test -c e2e/playwright.config.ts
