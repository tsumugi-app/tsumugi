# One-shot Codex review request: runs only when the pushed head commit's message contains the marker [codex-review]. Posts a single `@codex review`
# comment on the branch's open PR with the user-owned token (Codex ignores bot-authored comments). Not a loop: nothing is counted, waited for or re-posted.
name: codex-review-on-demand
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
jobs:
  request:
    if: contains(github.event.head_commit.message, '[codex-review]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = context.ref.replace("refs/heads/", "");
            const prs = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${head}`, per_page: 1 });
            if (!prs.data.length) { core.warning("no open PR for this branch"); return; }
            const sha = context.sha.slice(0, 7);
            const body = [
              "@codex review",
              "",
              "On-demand independent review of " + sha + ". Review-only: no merge, no deploy, no production data.",
              "Focus on the newest changes: (1) the storage-layer Memory lineage invariant in src/lib/db.ts (assertMemoryLineage, MemoryLineageViolationError) and whether ANY writer of the Memory store can still replace a stored Memory with one from another conversation;",
              "(2) restore-from-Vault writers that must never replace newer local data (restore*IfNotNewer) and the ChatScreen swap; (3) compare-and-set on Vault apply (putMemoryObjectAndMarkSynced / putConversationAndMarkSynced with the expected version in src/lib/vault.ts);",
              "(4) the crash recovery and maintenance session (src/lib/maintenance/*), Outbox / HOLD / protected-data non-mutation. Report only real defects with a concrete failure scenario.",
            ].join("\n");
            await github.rest.issues.createComment({ owner, repo, issue_number: prs.data[0].number, body });
