name: Claude Phase 0 (Issue 56)

'on':
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: github.repository == 'tsumugi-app/tsumugi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Claude Code
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://claude.ai/install.sh \
            --output "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" 2.1.327
          "$HOME/.local/bin/claude" --version

      - name: Verify a short Claude reply
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          def fail(category, exit_code):
              print(f"::error::Claude smoke test failed (category={category}, exit={exit_code})")
              _summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if _summary:
                  try:
                      with open(_summary, "a", encoding="utf-8") as _f:
                          _f.write(f"\nClaude smoke test failed: category={category}, exit={exit_code}\n")
                  except OSError:
                      pass
              sys.exit(1)

          if not os.environ.get("CLAUDE_CODE_OAUTH_TOKEN", "").strip():
              fail("missing-oauth-secret", 1)

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              env = {**os.environ, "CLAUDE_CONFIG_DIR": directory}
              try:
                  run = subprocess.run(
                      [
                          str(Path.home() / ".local/bin/claude"),
                          "-p", "Reply with exactly PHASE_0_OK and nothing else.",
                          "--tools", "", "--output-format", "json",
                      ],
                      cwd=directory,
                      env=env,
                      stdin=subprocess.DEVNULL,
                      capture_output=True,
                      text=True,
                      errors="replace",
                      timeout=90,
                  )
              except subprocess.TimeoutExpired:
                  fail("cli-timeout", 124)
              except OSError:
                  fail("cli-launch-failed", 1)

          try:
              reply = json.loads(run.stdout)
          except ValueError:
              reply = None

          if run.returncode == 0 and isinstance(reply, dict) and not reply.get("is_error"):
              result = reply.get("result")
              if isinstance(result, str) and result.strip() == "PHASE_0_OK":
                  print("Claude smoke test passed. Expected reply received.")
                  sys.exit(0)
              fail("unexpected-reply", 0)

          # Diagnostic output (approved by the owner on 2026-11-18):
          # print only a sanitized tail of the CLI output. The exact OAuth
          # token value, common token formats, authorization values,
          # credential-bearing URLs and email addresses are removed first,
          # and the output is limited to the last 25 lines / 3000 characters.
          diagnostics = run.stdout + "\n" + run.stderr
          _diag = diagnostics
          _secret = os.environ.get("CLAUDE_CODE_OAUTH_TOKEN", "")
          if _secret:
              _diag = _diag.replace(_secret, "[REDACTED]")
          for _pat, _rep in (
              (r"sk-ant-[A-Za-z0-9_\-]{8,}", "[REDACTED]"),
              (r"ghp_[A-Za-z0-9]{20,}", "[REDACTED]"),
              (r"github_pat_[A-Za-z0-9_]{20,}", "[REDACTED]"),
              (r"eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}", "[REDACTED]"),
              (r"(?i)bearer\s+[A-Za-z0-9._\-]+", "Bearer [REDACTED]"),
              (r"(?i)authorization\s*[:=]\s*\S+", "Authorization: [REDACTED]"),
              (r"(?i)(api[_-]?key|access[_-]?token|auth[_-]?token|password|secret)(\s*[:=]\s*)[^\s\"',}]+", r"\1\2[REDACTED]"),
              (r"https?://[^\s\"'@]+@[^\s\"']+", "[REDACTED-URL]"),
              (r"[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}", "[REDACTED-EMAIL]"),
          ):
              _diag = re.sub(_pat, _rep, _diag)
          _sanitized = "\n".join(_diag.splitlines()[-25:])[-3000:]
          print("----- sanitized Claude CLI output (tail) -----")
          print(_sanitized)
          print("----- end sanitized output -----")
          _summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if _summary:
              try:
                  with open(_summary, "a", encoding="utf-8") as _f:
                      _f.write("\n### Sanitized Claude CLI output (tail)\n\n```\n")
                      _f.write(_sanitized)
                      _f.write("\n```\n")
              except OSError:
                  pass
          for category, pattern in (
              ("cli-arguments", r"unknown option|unrecognized (option|argument)|too many arguments|missing required argument|option .+ argument missing|cannot be used with|usage: claude"),
              ("oauth-restricted", r"oauth.{0,80}(not supported|not allowed|only supported)|credential is only authorized"),
              ("authentication", r"\b401\b|unauthorized|authentication_error|invalid.{0,20}(api key|token|credential)|token.{0,30}expired|not logged in|not authenticated|please run /login|unable to authenticate|could not resolve authentication"),
              ("access-denied", r"\b403\b|forbidden|permission_error|access denied"),
              ("quota-or-billing", r"\b429\b|rate.limit|quota|usage.limit|credit balance|billing|hit your limit"),
              ("model-unavailable", r"model.{0,80}(not found|not available|does not exist)|overloaded|\b529\b"),
              ("network", r"unable to connect|connection error|network error|timed out|econn|enotfound|certificate|unable to reach"),
              ("api-error", r"api error|api_error|internal.server.error|service unavailable"),
          ):
              if re.search(pattern, diagnostics, re.IGNORECASE):
                  fail(category, run.returncode)
          fail("unknown-cli-error" if diagnostics.strip() else "no-cli-output", run.returncode)
          PY
