# Opens the pull request for a pushed claude/* branch (base: main) with the user-owned token, so that Codex's automatic review on PR
# creation fires (Codex ignores bot-authored activity). Never merges. Needs the repo secret CODEX_TRIGGER_TOKEN (Pull requests: write).
name: open-pr
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: read
concurrency:
  group: open-pr-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const head = context.ref.replace("refs/heads/", "");
            const open = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${head}`, per_page: 1 });
            if (open.data.length) { core.notice(`PR #${open.data[0].number} already exists.`); return; }
            const commit = context.payload.head_commit?.message ?? head;
            const pr = await github.rest.pulls.create({ owner, repo, head, base: "main", title: commit.split("\n")[0].slice(0, 120),
              body: `Opened automatically for \`${head}\`. Not to be merged by automation; the owner decides.` });
            core.notice(`Opened PR #${pr.data.number}`);
